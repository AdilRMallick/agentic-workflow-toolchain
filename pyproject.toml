[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-workflow-toolchain"
version = "0.1.0"
description = "Custom agents and MCP servers that automate recurring research and tracking workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Adil Mallick" }]
keywords = ["mcp", "claude", "agents", "research", "automation"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["mcp>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
awt = "awt.cli:main"
awt-research-mcp = "awt.mcp.research_server:main"
awt-tracker-mcp = "awt.mcp.tracker_server:main"

[project.urls]
Homepage = "https://github.com/AdilRMallick/agentic-workflow-toolchain"

[tool.hatch.build.targets.wheel]
packages = ["src/awt"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET", "ARG", "PTH", "TID"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "ARG005"]

[tool.mypy]
python_version = "3.11"
packages = ["awt"]
mypy_path = "src"
strict = true
warn_unreachable = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]
